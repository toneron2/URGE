[package]
name        = "urge-meta"
description = "URGE meta-engine: Figure 26 pipeline — tokenizer, paradigm router, cross-validator, verdict synthesizer"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
keywords.workspace     = true
readme.workspace       = true
categories.workspace   = true

[features]
default = ["std"]
alloc   = ["urge-core/alloc", "urge-engines/alloc"]
std     = ["alloc", "urge-core/std", "urge-engines/std"]
# An alias for `std`. The regex crate was a dependency through 0.1.3 and never used; the
# feature name stays so a manifest that enables it still builds.
regex   = ["std"]
serde   = ["urge-core/serde", "urge-engines/serde", "dep:serde"]
# JSON in, JSON out for non-Rust callers (urge-wasm, urge-cli): src/json.rs
json    = ["std", "serde", "dep:serde_json"]

[dependencies]
urge-core    = { path = "../urge-core",    version = "0.1.4" }
urge-engines = { path = "../urge-engines", version = "0.1.4" }
serde        = { version = "1", features = ["derive"], optional = true }
serde_json   = { version = "1", optional = true }
heapless     = { version = "0.8", default-features = false }
log          = { version = "0.4", default-features = false }
smallvec     = { version = "1.11", default-features = false }
