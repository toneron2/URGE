[package]
name        = "urge-cli"
description = "urge-eval: evaluate a URGE governance expression from the command line, JSON in and JSON out"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
keywords.workspace     = true
readme.workspace       = true
categories             = ["command-line-utilities"]
# Not on crates.io: install it pinned to a release tag (README, "From any language").
publish                = false

[[bin]]
name = "urge-eval"
path = "src/main.rs"

[dependencies]
urge-meta  = { path = "../urge-meta", version = "0.1.3", features = ["std", "serde", "json"] }
serde_json = "1"
